# Section 4. Under review and in preparation.
# "status" is the chip shown under the citation.

- title: "Fictitious Consent: Structural Asymmetry and Student Data Under India's Digital Personal Data Protection Act"
  cite:
    - With Durgesh Jha · EPW Engage
  status: Under review, on an accepted pitch
  plainly: >-
    A student cannot meaningfully refuse the university that evaluates
    them. Long-term dependence on a formative institution makes consent
    quasi-coercive, leaving it an inadequate basis for data legitimacy.
    The Act's exemptions for educational institutions then lift exactly
    the obligations that dependence makes necessary. Socio-legal method,
    reading the Act and its 2025 Rules against GDPR and FERPA.

- title: "The Passive Conduit and Its Limits: Is It Time for India to Rethink Its Intermediary Definition?"
  cite:
    - Digi-Con, OpinionByte · Accepted, to be published
  status: Forthcoming
  plainly: >-
    Close-reads s. 2(1)(<em>w</em>) of the IT Act to surface the four
    assumptions buried in it: passive, neutral, middle-positioned,
    handling discrete records. Predictive search violates all four.
    Rule-making in 2011, 2021 and 2026 built a typology in subordinate
    legislation while the definition itself sat untouched, where the EU
    put its typology in primary law instead. The argument is for a tiered
    typology in the parent Act.
